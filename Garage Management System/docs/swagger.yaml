definitions:
  models.BFFCreateCustomerRequest:
    properties:
      confirmPassword:
        example: Admin@123
        minLength: 8
        type: string
      customerName:
        example: Arjit
        maxLength: 32
        minLength: 5
        type: string
      email:
        example: arijit@gmail.com
        type: string
      password:
        example: Admin@123
        maxLength: 20
        minLength: 8
        type: string
      phoneNumber:
        example: "7568912340"
        type: string
    required:
    - confirmPassword
    - customerName
    - email
    - password
    - phoneNumber
    type: object
  models.ErrorAPIResponse:
    properties:
      error:
        type: string
      errors:
        $ref: '#/definitions/models.ErrorMessage'
    type: object
  models.ErrorMessage:
    properties:
      errorMessage:
        type: string
      key:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/register/customer:
    post:
      consumes:
      - application/json
      description: Handles customer registration by validating input and storing user
        details
      parameters:
      - description: Customer Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFCreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Customer created successfully
          schema:
            type: string
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorAPIResponse'
      summary: Create a new customer
      tags:
      - Customer
swagger: "2.0"

  models.BFFAddMechanicRequest:
    properties:
      aadhar_number:
        example: "112233445566"
        type: string
      name:
        example: Mukesh Roy
        type: string
      phoneNumber:
        example: 8432805566
        maximum: 9999999999
        minimum: 1000000000
        type: integer
    required:
    - aadhar_number
    - name
    - phoneNumber
    type: object
  models.BFFAddMechanicResponse:
    properties:
      mechanic_id:
        example: arijit777
        type: string
      status:
        example: Successfully added
        type: string
    type: object
  models.BFFAddNewServiceRequest:
    properties:
      amount:
        example: 1745.99
        minimum: 99
        type: number
      service:
        example: painting
        minLength: 3
        type: string
    required:
    - service
    type: object
  models.BFFAddNewServiceResponse:
    properties:
      message:
        example: service added successfully
        type: string
    type: object
  models.BFFAddVisitRecordsRequest:
    properties:
      arrival_date:
        example: "2026-05-20"
        type: string
      delivery_date:
        example: "2026-05-20"
        type: string
      mechanic_id:
        example: firstname012
        type: string
      number_plate:
        example: MH19BW3626
        type: string
      services:
        example:
        - painting
        - denting
        - oiling
        items:
          type: string
        type: array
    required:
    - mechanic_id
    - number_plate
    - services
    type: object
  models.BFFAddVisitRecordsResponse:
    properties:
      status:
        example: Visit Records Added Sucessfully
        type: string
    type: object
  models.BFFCreateCustomerRequest:
    properties:
      confirmPassword:
        example: Admin@123
        minLength: 8
        type: string
      customerName:
        example: Arjit
        maxLength: 32
        minLength: 5
        type: string
      email:
        example: arijit@gmail.com
        type: string
      password:
        example: Admin@123
        maxLength: 20
        minLength: 8
        type: string
      phoneNumber:
        example: 7568912340
        maximum: 9999999999
        minimum: 1000000000
        type: integer
    required:
    - confirmPassword
    - customerName
    - email
    - password
    - phoneNumber
    type: object
  models.BFFCreateVehicleRequest:
    properties:
      model:
        example: Dezire
        type: string
      number_plate:
        example: MH19BW3626
        type: string
    required:
    - model
    - number_plate
    type: object
  models.BFFCreateVehicleResponse:
    properties:
      status:
        example: Successfully Created
        type: string
    type: object
  models.BFFDeleteMechanicRequest:
    properties:
      mechanic_id:
        example: arijit709
        type: string
    required:
    - mechanic_id
    type: object
  models.BFFDeleteMechanicResponse:
    properties:
      status:
        example: Successfully deleted
        type: string
    type: object
  models.BFFDeleteServiceRequest:
    properties:
      service:
        example: painting
        minLength: 3
        type: string
    required:
    - service
    type: object
  models.BFFDeleteServiceResponse:
    properties:
      message:
        example: service deleted successfully
        type: string
    type: object
  models.BFFGenerateBillRequest:
    properties:
      number_plate:
        type: integer
    required:
    - number_plate
    type: object
  models.BFFGenerateBillResponse:
    properties:
      bill_amount:
        type: number
      status:
        example: Bill Generated Sucessfully
        type: string
    type: object
  models.BFFLoginUserRequest:
    properties:
      email:
        type: string
      password:
        example: Admin@123
        type: string
      role:
        example: customer or admin
        type: string
    required:
    - email
    - password
    - role
    type: object
  models.BFFLoginUserResponse:
    properties:
      message:
        example: user logged in successfully
        type: string
      token:
        type: string
    type: object
  models.BFFLogoutUserResponse:
    properties:
      message:
        example: user logged out successfully
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns JWT token
      parameters:
      - description: User Sign In Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFLoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/models.BFFLoginUserResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.BFFLoginUserResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.BFFLoginUserResponse'
        "404":
          description: User does not exist
          schema:
            $ref: '#/definitions/models.BFFLoginUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BFFLoginUserResponse'
      summary: Login registered user or admin
      tags:
      - User
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logouts user by deleting token from redis
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/models.BFFLogoutUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BFFLogoutUserResponse'
      security:
      - BearerAuth: []
      summary: Logout registered user or admin
      tags:
      - User
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Handles customer registration by validating input and storing user
        details
      parameters:
      - description: Customer Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFCreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Customer created successfully
          schema:
            type: string
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/garage_management_system_src_app_authentication_models.ErrorAPIResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/garage_management_system_src_app_authentication_models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/garage_management_system_src_app_authentication_models.ErrorAPIResponse'
      summary: Create a new customer
      tags:
      - User
  /api/mechanics/add:
    post:
      consumes:
      - application/json
      description: Handles mechanic add request by validating input and storing mechanics
        details
      parameters:
      - description: mechanic add Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFAddMechanicRequest'
      produces:
      - application/json
      responses:
        "201":
          description: mechanic added successfully
          schema:
            $ref: '#/definitions/models.BFFAddMechanicResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/garage_management_system_src_app_assets_models.ErrorAPIResponse'
        "409":
          description: Duplicate value in request
          schema:
            $ref: '#/definitions/garage_management_system_src_app_assets_models.ErrorAPIResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/garage_management_system_src_app_assets_models.ErrorAPIResponse'
      summary: Adds new mechanic
      tags:
      - Mechanics
  /api/mechanics/delete:
    delete:
      consumes:
      - application/json
      description: Handles mechanic Delete request by validating input.
      parameters:
      - description: mechanic Delete Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFDeleteMechanicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: mechanic Deleted successfully
          schema:
            $ref: '#/definitions/models.BFFDeleteMechanicResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/garage_management_system_src_app_assets_models.ErrorAPIResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/garage_management_system_src_app_assets_models.ErrorAPIResponse'
      summary: Delete mechanic
      tags:
      - Mechanics
  /api/services/add:
    post:
      consumes:
      - application/json
      description: Adds a new service to the DB
      parameters:
      - description: Add Service Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFAddNewServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Added service successful
          schema:
            $ref: '#/definitions/models.BFFAddNewServiceResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.BFFAddNewServiceResponse'
        "401":
          description: Unauthorized role
          schema:
            $ref: '#/definitions/models.BFFAddNewServiceResponse'
        "409":
          description: Service already exists
          schema:
            $ref: '#/definitions/models.BFFAddNewServiceResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BFFAddNewServiceResponse'
      security:
      - BearerAuth: []
      summary: Add a new service
      tags:
      - Services
  /api/services/delete:
    delete:
      consumes:
      - application/json
      description: Deletes an existing service from the DB
      parameters:
      - description: Delete Service Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFDeleteServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Deleted service successful
          schema:
            $ref: '#/definitions/models.BFFDeleteServiceResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/models.BFFDeleteServiceResponse'
        "401":
          description: Unauthorized role
          schema:
            $ref: '#/definitions/models.BFFDeleteServiceResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BFFDeleteServiceResponse'
      summary: Delete an existing service
      tags:
      - Services
  /api/vehicles/create-vehicle:
    post:
      consumes:
      - application/json
      description: Handles Vehicle registration by validating input and storing Vehicle
        details
      parameters:
      - description: Vehicle Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFCreateVehicleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/models.BFFCreateVehicleResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
        "409":
          description: Duplicate value in request
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
      summary: Create a new Vehicle
      tags:
      - Vehicles
  /api/visits/add-record:
    post:
      consumes:
      - application/json
      description: Handles visit addition request by validating input and storing
        visit details
      parameters:
      - description: Vehicle Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFAddVisitRecordsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/models.BFFAddVisitRecordsResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/garage_management_system_src_models.ErrorAPIResponse'
      summary: Create a new visit record
      tags:
      - Visits
  /api/visits/get-bill:
    post:
      consumes:
      - application/json
      description: Handles generation of bill for the respective visit
      parameters:
      - description: Bill Generation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BFFGenerateBillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Bill Generated Successfully
          schema:
            $ref: '#/definitions/models.BFFGenerateBillResponse'
        "400":
          description: Invalid input payload
          schema:
            $ref: '#/definitions/garage_management_system_src_app_visits_models.ErrorAPIResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/garage_management_system_src_app_visits_models.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/garage_management_system_src_app_visits_models.ErrorAPIResponse'
      summary: Generate Bill for the Visit
      tags:
      - Visits
